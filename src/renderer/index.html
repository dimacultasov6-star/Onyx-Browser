<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Onyx</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="theme-dark">
    <!-- ================= TITLE BAR ================= -->
    <div id="titlebar">
      <div class="tb-left">
        <div id="logo" title="Onyx">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 9h17M3.5 15h17" stroke="currentColor" stroke-width="2"/></svg>
          <span>Onyx</span>
        </div>
      </div>
      <div class="tb-center" id="tbSearchHint"></div>
      <div class="tb-right">
        <button class="tb-btn" id="btnMin" title="Свернуть" aria-label="Свернуть">
          <svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="tb-btn" id="btnMax" title="Развернуть" aria-label="Развернуть">
          <svg viewBox="0 0 12 12" width="11" height="11"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="tb-btn danger" id="btnClose" title="Закрыть" aria-label="Закрыть">
          <svg viewBox="0 0 12 12" width="11" height="11"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>

    <!-- ================= TAB STRIP ================= -->
    <div id="tabstrip">
      <div id="tabs" role="tablist"></div>
      <div class="strip-actions">
        <button class="icon-btn" id="btnNewTab" title="Новая вкладка (Ctrl+T)">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btnTabsMenu" title="Список вкладок">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- ================= TOOLBAR ================= -->
    <div id="toolbar">
      <div class="tb-group">
        <button class="icon-btn" id="btnBack" title="Назад (Alt+←)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btnForward" title="Вперёд (Alt+→)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btnReload" title="Обновить (F5)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btnHome" title="Домой (Alt+Home)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 7.5L8 2.8l5.5 4.7V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="address-wrap" id="addressWrap">
        <div class="address" id="address">
          <span class="secure" id="secureIcon" title="Соединение защищено">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="3.5" y="7" width="9" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </span>
          <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Поиск или адрес" />
          <button class="addr-btn" id="btnStar" title="Добавить в закладки (Ctrl+D)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2l1.9 3.9 4.1.6-3 2.9.7 4.2L8 11.6l-3.7 2 .7-4.2-3-2.9 4.1-.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button class="addr-btn" id="btnPageMenu" title="Меню страницы">
            <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="suggest" class="suggest hidden"></div>
      </div>

      <div class="tb-group">
        <button class="icon-btn" id="btnZoom" title="Масштаб">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="popup hidden" id="zoomMenu"></div>
        <button class="icon-btn" id="btnFind" title="Найти на странице (Ctrl+F)">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btnHistory" title="История (Ctrl+H)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 3.5a4.5 4.5 0 1 1-4.3 5.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3.5 3v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 5.5V8l2 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btnBookmarksPanel" title="Закладки (Ctrl+Shift+O)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 2.5h8a.5.5 0 0 1 .5.5v10.5l-4.5-3-4.5 3V3a.5.5 0 0 1 .5-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btnDownloads" title="Загрузки (Ctrl+J)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 2.5v7M5 7l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 12.5h10.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="badge hidden" id="dlBadge">0</span>
        </button>
        <button class="icon-btn" id="btnMenu" title="Меню Onyxа">
          <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <!-- ================= FIND BAR ================= -->
    <div id="findbar" class="hidden">
      <button class="icon-btn small" id="findClose" title="Закрыть (Esc)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <input id="findInput" type="text" placeholder="Найти на странице" spellcheck="false" />
      <span id="findCount" class="find-count">0/0</span>
      <button class="icon-btn small" id="findPrev" title="Предыдущее (Shift+Enter)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn small" id="findNext" title="Следующее (Enter)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <label class="chk"><input type="checkbox" id="findCase" /><span>Учитывать регистр</span></label>
    </div>

    <!-- ================= BOOKMARKS BAR ================= -->
    <div id="bookmarksbar"></div>

    <!-- ================= WEB CONTENT AREA ================= -->
    <div id="webarea"></div>

    <!-- ================= DOWNLOADS PANEL ================= -->
    <div id="downloads" class="panel hidden">
      <div class="panel-head">
        <strong>Загрузки</strong>
        <div class="spacer"></div>
        <button class="btn ghost sm" id="dlClear">Очистить завершённые</button>
        <button class="icon-btn small" id="dlClose" title="Закрыть">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="panel-body" id="dlList"></div>
    </div>

    <!-- ================= OVERLAYS ================= -->
    <div id="overlay" class="overlay hidden">
      <div class="modal" id="modal">
        <div class="modal-head">
          <strong id="modalTitle">Заголовок</strong>
          <div class="spacer"></div>
          <button class="icon-btn small" id="modalClose">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
      </div>
    </div>

    <!-- ================= CONTEXT MENU ================= -->
    <div id="ctxmenu" class="ctxmenu hidden"></div>

    <!-- ================= TOAST ================= -->
    <div id="toast" class="toast hidden"></div>

    <!-- ================= POPUP (tab list, zoom) ================= -->
    <div id="tablistPopup" class="popup wide hidden"></div>
    <div id="mainMenu" class="popup menu hidden"></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/address.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/overlays.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
